<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وحدة الذكاء الاصطناعي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #070b14;
            --card-bg: rgba(17, 24, 39, 0.78);
            --card-border: rgba(148, 163, 184, 0.16);
            --accent-primary: #6366f1;
            --accent-secondary: #22d3ee;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.22), transparent 40%),
                radial-gradient(circle at 85% 10%, rgba(34, 211, 238, 0.14), transparent 38%),
                radial-gradient(circle at 50% 90%, rgba(139, 92, 246, 0.14), transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 36px 16px 60px;
            line-height: 1.55;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
        }

        .hero-box {
            position: relative;
            background: linear-gradient(145deg, rgba(20, 29, 48, 0.9), rgba(12, 18, 32, 0.92));
            border: 1px solid rgba(99, 102, 241, 0.28);
            border-radius: 22px;
            padding: 34px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            margin-bottom: 36px;
            overflow: hidden;
        }

        .hero-box::before {
            content: "";
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 120px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            filter: blur(75px);
            opacity: 0.35;
            pointer-events: none;
        }

        .ai-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            color: #a5f3fc;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.28);
            margin-bottom: 14px;
        }

        .project-title {
            position: relative;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff 10%, #c7d2fe 55%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 22px;
        }

        .supervisor-box {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(129, 140, 248, 0.35);
            border-radius: 16px;
            padding: 12px 22px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .supervisor-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-primary), #8b5cf6);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
        }

        .supervisor-details {
            text-align: right;
        }

        .supervisor-label {
            font-size: 12px;
            color: var(--accent-secondary);
            font-weight: 700;
        }

        .supervisor-name {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 19px;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-secondary);
        }

        .count-pill {
            font-size: 13px;
            font-weight: 700;
            color: #c7d2fe;
            background: rgba(99, 102, 241, 0.16);
            border: 1px solid rgba(99, 102, 241, 0.32);
            padding: 4px 12px;
            border-radius: 999px;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .member-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 24px 18px;
            text-align: center;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .member-card:hover {
            transform: translateY(-5px);
            border-color: rgba(34, 211, 238, 0.45);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.16);
        }

        .avatar-ring {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            margin: 0 auto 14px auto;
            box-shadow: 0 6px 18px rgba(34, 211, 238, 0.18);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #0f172a;
            color: #a5b4fc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            overflow: hidden;
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-name {
            font-size: 15.5px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .member-role {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        @media (max-width: 920px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .hero-box {
                padding: 26px 18px;
                border-radius: 18px;
            }

            .project-title {
                font-size: 24px;
            }

            .supervisor-box {
                width: 100%;
                justify-content: flex-start;
            }

            .team-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .member-card {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="hero-box">
            <div class="ai-badge">
                <i class="fa-solid fa-microchip"></i>
                <span>بانر تعليمي تفاعلي</span>
            </div>
            <h1 class="project-title">وحدة الذكاء الاصطناعي</h1>

            <div class="supervisor-box">
                <div class="supervisor-icon">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <div class="supervisor-details">
                    <div class="supervisor-label">تحت إشراف</div>
                    <div class="supervisor-name">أ.د / نجلاء سعيد</div>
                </div>
            </div>
        </header>

        <section>
            <div class="section-header">
                <h2 class="section-title">
                    <i class="fa-solid fa-users-gear"></i>
                    <span>فريق تصميم البانر والمحتوى</span>
                </h2>
                <span class="count-pill" id="membersCount">15 أعضاء</span>
            </div>

            <div class="team-grid" id="teamGrid"></div>
        </section>
    </div>

    <script>
        const students = [
            { name: 'حنين محمد حسن الدمرداش', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user-graduate' },
            { name: 'سمر صبري شعبان إبراهيم', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user' },
            { name: 'منه الله ايمن عبدالرحمن محمد الدمرداش', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user-graduate' },
            { name: 'منه الله خالد الشحات سراج', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user' },
            { name: 'منه الله ايمن فتحي محمد قطب', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user-graduate' },
            { name: 'شذي محمد حسن السيد', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user' },
            { name: 'اشرقت احمد يوسف', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user-graduate' },
            { name: 'اسماء ياسر ناصف عبد المنعم', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user' },
            { name: 'اميره محمد عبدالرؤوف محمد', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user-graduate' },
            { name: 'روضه ياسر مصطفى عطيه', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user' },
            { name: 'بسملة السيد عبده سعيد', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user-graduate' },
            { name: 'منه محمد احمد سعيد', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user' },
            { name: 'شهد نادر أحمد إبراهيم', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user-graduate' },
            { name: 'زينب وائل سمير عتريس', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user' },
            { name: 'هيام حسن محمد حسن', role: 'مصمم البانر والمحتوى', photo: null, icon: 'fa-user-graduate' }
        ];

        const grid = document.getElementById('teamGrid');
        const countEl = document.getElementById('membersCount');
        countEl.textContent = `${students.length} أعضاء`;

        students.forEach(student => {
            const card = document.createElement('div');
            card.className = 'member-card';

            const avatarContent = student.photo
                ? `<img src="${student.photo}" alt="${student.name}">`
                : `<i class="fa-solid ${student.icon}"></i>`;

            card.innerHTML = `
                <div class="avatar-ring">
                    <div class="avatar-inner">${avatarContent}</div>
                </div>
                <div class="member-name">${student.name}</div>
                <div class="member-role">${student.role}</div>
            `;

            grid.appendChild(card);
        });
    </script>

</body>
</html>
